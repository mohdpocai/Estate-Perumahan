<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengurusan Rumah Pekerja - LP2</title>
  <!-- Pustaka html2canvas & jsPDF untuk Fungsi Ekstrak PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
:root{--bg:#F3F5F9;--sf:#fff;--line:#E3E8EF;--ink:#0F172A;--mut:#64748B;--nav:#0B2545;--brand:#1D6FB8;--ok:#15803D;--warn:#B45309;--bad:#DC2626;--r:10px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px}
button,input,select{font-family:inherit}
#app-container{display:flex;flex-direction:column;width:100vw;height:100dvh}
/* header */
#app-header{flex-shrink:0;background:var(--nav);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{background:var(--brand);font-weight:700;font-size:12px;padding:5px 8px;border-radius:6px;letter-spacing:.5px}
.brand-text{font-weight:600;font-size:14px}
#layoutSelect{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 8px;font-size:12px;max-width:150px}
#layoutSelect option{color:#000}
.view-tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;flex-shrink:0}
.view-tab{border:0;background:transparent;color:#B8C4D6;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.view-tab.active{background:#fff;color:var(--nav)}
.tab-count{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;display:none}
#headerSearch{flex:1;min-width:120px;padding:8px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:13px}
#headerSearch::placeholder{color:#94A3B8}
#syncStatus{font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
.menu-wrap{position:relative;flex-shrink:0}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer}
.menu{display:none;position:absolute;right:0;top:42px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.25);min-width:210px;padding:6px;z-index:500}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.btn-import-local{display:none}
/* list */
#listView,#defectView,#summaryView{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#defectView,#summaryView{display:none}
.filter-bar{flex-shrink:0;display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--line)}
.filter-chip{border:1px solid var(--line);background:var(--sf);color:var(--mut);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--nav);border-color:var(--nav);color:#fff}
#listScroll,#defectScroll,#summaryScroll{flex:1;overflow-y:auto;padding:16px 16px 96px;max-width:900px;width:100%;margin:0 auto}
.empty-state{text-align:center;color:var(--mut);margin-top:60px;line-height:1.7}
.building-card{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.building-card:hover{box-shadow:0 4px 14px rgba(15,23,42,.08);border-color:#C7D2E0}
.card-icon{font-size:20px;width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-main{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600}
.card-sub{font-size:12px;color:var(--mut);margin-top:2px}
.card-chevron{color:#B0BAC9;font-size:20px}
.occupancy-pill,.defect-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:6px}
.occupancy-pill{background:#ECFDF5;color:var(--ok)}
.defect-pill{background:#FEF2F2;color:var(--bad);margin-left:6px}
.building-card.has-defect{border-left:3px solid var(--bad)}
.fab-add{position:absolute;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:26px;cursor:pointer;box-shadow:0 6px 18px rgba(29,111,184,.45);z-index:60}
/* defect tracker */
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum-card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.sum-card.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(29,111,184,.15)}
.sum-card b{display:block;font-size:24px}
.sum-card span{font-size:12px;color:var(--mut)}
.def-card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--bad)}
.def-card.st-prog{border-left-color:#D97706}.def-card.st-done{border-left-color:var(--ok);opacity:.8}
.def-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.def-title{font-weight:600}.def-loc{font-size:12px;color:var(--mut);margin-top:2px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.st-new{background:#FEF2F2;color:var(--bad)}.badge.st-prog{background:#FFFBEB;color:var(--warn)}.badge.st-done{background:#F0FDF4;color:var(--ok)}
.def-meta{font-size:12px;color:var(--mut);margin:8px 0}
.def-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.def-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.def-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
/* map */
#mapView{flex:1;position:relative;display:none;overflow:hidden}
.toolbar{position:absolute;top:12px;left:12px;right:12px;z-index:100;background:var(--sf);border:1px solid var(--line);padding:8px 10px;border-radius:12px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 16px rgba(15,23,42,.1);overflow-x:auto}
.toolbar-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.toolbar-divider{width:1px;align-self:stretch;min-height:24px;background:var(--line);margin:0 4px;flex-shrink:0}
.btn-tool{border:1px solid transparent;padding:7px 11px;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px;flex-shrink:0;white-space:nowrap}
.btn-pekerja{background:#D1FAE5;color:#065F46}.btn-office{background:#DBEAFE;color:#1E40AF}.btn-kedai{background:#FEF3C7;color:#92400E}.btn-dewan{background:#EDE9FE;color:#5B21B6}.btn-store{background:#FFEDD5;color:#9A3412}.btn-surau{background:#CCFBF1;color:#115E59}.btn-tool-road{background:#E2E8F0;color:#334155}
.btn-zoom,.btn-reset-view{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn-lock{background:#FEF3C7;color:#92400E}.btn-lock.locked{background:var(--bad);color:#fff}
.zoom-display{font-size:12px;font-weight:700;color:var(--brand);min-width:40px;text-align:center}
#canvas-container{width:100%;height:100%;position:relative;background:#EEF2F7;overflow:hidden;cursor:grab;touch-action:none}
#canvas-viewport{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;background-image:linear-gradient(to right,rgba(148,163,184,.3) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.3) 1px,transparent 1px);background-size:20px 20px}
.element-box{position:absolute;border-radius:6px;cursor:move;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;user-select:none;box-shadow:0 2px 8px rgba(15,23,42,.12);border:2px solid transparent;text-align:center;flex-direction:column;padding:4px;transform-origin:center;transition:left .15s,top .15s,width .15s,height .15s,transform .15s;touch-action:none}
.element-box.is-locked{cursor:pointer!important}
.element-box.dragging,.element-box.resizing,.element-box.rotating{transition:none!important}
.type-pekerja{background:#D1FAE5;color:#065F46;border-color:#10B981}.type-office{background:#DBEAFE;color:#1E40AF;border-color:#3B82F6}.type-kedai{background:#FEF3C7;color:#92400E;border-color:#F59E0B}.type-dewan{background:#EDE9FE;color:#5B21B6;border-color:#8B5CF6}.type-store{background:#FFEDD5;color:#9A3412;border-color:#F97316}.type-surau{background:#CCFBF1;color:#115E59;border-color:#14B8A6}.type-road{background:#CBD5E1;color:#475569;border-color:#94A3B8;flex-direction:row}
.element-box.active{border-color:var(--nav)!important;box-shadow:0 0 0 3px rgba(11,37,69,.25)}
.element-box.has-defect{border-color:var(--bad);box-shadow:0 0 0 3px rgba(220,38,38,.25)}
.defect-badge{position:absolute;top:-9px;right:-9px;background:var(--bad);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;z-index:5}
.resize-handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:#fff;border:2px solid var(--nav);border-radius:3px;cursor:nwse-resize;display:none;touch-action:none}
.rotate-handle{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:16px;height:16px;background:var(--brand);border:2px solid #fff;border-radius:50%;cursor:grab;display:none;touch-action:none}
.rotate-handle::after{content:'';position:absolute;top:14px;left:5px;width:2px;height:8px;background:var(--brand)}
.element-box.active:not(.is-locked) .resize-handle,.element-box.active:not(.is-locked) .rotate-handle{display:block}
/* modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(11,37,69,.5);z-index:300;align-items:flex-end;justify-content:center}
.modal-backdrop.open{display:flex}
.modal-panel{background:var(--sf);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(15,23,42,.3)}
@media(min-width:640px){.modal-backdrop{align-items:center}.modal-panel{border-radius:16px}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h2{margin:0;font-size:16px}
.btn-close-modal{background:var(--bg);border:0;color:var(--mut);width:30px;height:30px;border-radius:8px;font-size:14px;cursor:pointer}
.modal-body{flex:1;overflow-y:auto;padding:20px;background:var(--bg);border-radius:0 0 16px 16px}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.add-grid button{padding:16px 10px;font-size:13px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select{width:100%;padding:9px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px}
input:focus,select:focus{outline:2px solid rgba(29,111,184,.35);border-color:var(--brand)}
.door-card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.door-card-title{font-size:13px;font-weight:700;color:var(--nav);margin-bottom:8px}
.checklist-title,.checklist-title-defect{font-size:12px;font-weight:700;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.checklist-title-defect{color:var(--bad)}
.rename-field{margin-bottom:6px}.rename-field input{font-weight:600;font-size:15px}
.door-name-input{margin-bottom:8px}
.door-actions-row{display:flex;gap:8px;margin-top:12px}
.btn-door-add,.btn-door-remove{flex:1;padding:10px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--sf)}
.btn-door-add{color:var(--brand)}.btn-door-remove{color:var(--bad)}
.item-row{background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:6px}
.item-row-alert{background:#FEF8F8;border-color:#FBCACA}
.item-header{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500}
.item-header input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.item-details{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.image-action-buttons{display:flex;gap:6px}
.btn-camera-action,.btn-gallery-action{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.img-preview-container{position:relative;display:inline-block;margin-top:6px}
.img-preview{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.btn-remove-img{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;padding:0}
.btn-action{width:100%;padding:11px;border:0;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px;font-size:13px}
.btn-pdf{background:var(--nav);color:#fff}.btn-delete{background:#FEF2F2;color:var(--bad);border:1px solid #FBCACA}
#camera-modal{display:none;position:fixed;inset:0;background:rgba(11,37,69,.95);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
#camera-video{width:100%;max-width:500px;max-height:60vh;background:#000;border-radius:12px;object-fit:cover}
.camera-controls{display:flex;gap:12px;margin-top:16px;width:100%;max-width:500px}
.btn-capture,.btn-cancel-cam{flex:1;padding:12px;border:0;border-radius:8px;font-weight:600;cursor:pointer;color:#fff}
.btn-capture{background:var(--brand)}.btn-cancel-cam{background:#475569}
#login-overlay{display:flex;position:fixed;inset:0;background:linear-gradient(160deg,var(--nav),#16467A);z-index:2000;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-box h2{margin:0 0 4px;color:var(--nav);font-size:20px}
.login-box p{margin:0 0 18px;color:var(--mut);font-size:13px}
.login-box input{margin-bottom:10px}
.login-box button{width:100%;padding:12px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
#loginError{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
#loading-overlay{display:none;position:fixed;inset:0;background:rgba(11,37,69,.8);z-index:999;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-weight:600}
.evidence{margin-top:8px}.evidence>label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
.repl-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:6px;margin-left:6px;background:#FFFBEB;color:var(--warn)}
.element-box.has-repl{border-color:#D97706;box-shadow:0 0 0 3px rgba(217,119,6,.25)}
.element-box.has-defect.has-repl{border-color:var(--bad)}
.repl-badge{position:absolute;top:-10px;left:-10px;background:#D97706;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;z-index:5}
.building-card.has-repl{border-left:3px solid #D97706}
.warn-banner{background:#FFFBEB;border:1px solid #FCD34D;color:#92400E;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.6}
.sum-row.four{grid-template-columns:repeat(4,1fr)}
.sum-card.plain{cursor:default}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:8px}.bar i{display:block;height:100%}
.sum-item{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.sum-item>summary{padding:14px 16px;cursor:pointer;list-style:none}
.sum-item>summary::-webkit-details-marker{display:none}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.sum-counts{font-size:12px;color:var(--mut);margin-top:6px}
.loc-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.loc-row:hover{background:var(--bg)}.loc-row small{color:var(--mut)}
@media(max-width:760px){.sum-row.four{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.brand-text{display:none}#app-header{flex-wrap:wrap;padding:10px 12px}#headerSearch{order:9;flex-basis:100%}.view-tab{padding:7px 10px}.def-fields,.sum-row{grid-template-columns:1fr 1fr}}
/* door overview (top of detail window) */
.door-ov{margin:12px 0}
.door-ov-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mut);margin-bottom:6px}
.door-ov-head b{color:var(--ink);font-size:13px}
.door-ov-grid{display:grid;gap:8px}
.door-tile{border:1px solid var(--line);border-left:4px solid var(--ok);background:#F0FDF4;border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.door-tile.st-ganti{border-left-color:#D97706;background:#FFFBEB}
.door-tile.st-rosak{border-left-color:var(--bad);background:#FEF2F2}
.door-tile.vacant{border-style:dashed;border-left-style:solid;background:#F8FAFC}
.door-tile.vacant.st-ganti{background:#FFFBEB}.door-tile.vacant.st-rosak{background:#FEF2F2}
.door-tile.vacant:not(.st-ganti):not(.st-rosak){border-left-color:#CBD5E1}
.door-tile .dt-label{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door-tile .dt-name{font-size:13px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.door-tile.vacant .dt-name{color:var(--mut);font-weight:500;font-style:italic}
.door-tile .dt-flag{font-size:11px;font-weight:600;margin-top:2px}
.door-tile.st-rosak .dt-flag{color:var(--bad)}.door-tile.st-ganti .dt-flag{color:var(--warn)}
.door-ov-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.door-ov-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>🏘️ Pengurusan LP2</h2>
      <p id="loginMessage">Sila log masuk untuk mengakses rekod.</p>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Emel" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Kata laluan" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
        <button onclick="doLogin()">Log Masuk</button>
      </div>
      <div id="loginError"></div>
    </div>
  </div>

  <div id="loading-overlay">
    <div style="font-size: 18px; margin-bottom: 10px;">📄 Menyedia, Mengorientasi & Tangkap Map Ke PDF...</div>
    <div style="font-size: 12px; color: #94A3B8;">Sila tunggu sebentar.</div>
  </div>

  <div id="camera-modal">
    <h3 style="color:#38BDF8; margin-bottom:10px;">Tangkap Gambar Bukti</h3>
    <video id="camera-video" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="btn-capture" onclick="takePicture()">📸 Ambil Gambar</button>
      <button class="btn-cancel-cam" onclick="closeCameraModal()">Batal</button>
    </div>
  </div>

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /* ===================== STORAGE ===================== */
    function saveToStorage() {
      if (!dbReady || !currentLayoutId) return;
      const updates = {};
      const currentIds = new Set();
      elements.forEach(el => {
        currentIds.add(el.id);
        const json = JSON.stringify(el);
        if (lastSaved[el.id] !== json) {
          updates['layouts/' + currentLayoutId + '/elements/' + el.id] = JSON.parse(json);
          lastSaved[el.id] = json;
        }
      });
      Object.keys(lastSaved).forEach(id => {
        if (!currentIds.has(id)) {
          updates['layouts/' + currentLayoutId + '/elements/' + id] = null;
          delete lastSaved[id];
        }
      });
      if (Object.keys(updates).length) {
        db.ref().update(updates).catch(err => alert('Gagal simpan ke Firebase: ' + err.message));
      }
    }

    function idTime(id) { return parseInt(String(id).split('_').pop(), 10) || 0; }

    function normalizeElement(raw) {
      const el = JSON.parse(JSON.stringify(raw));
      if (el.type === 'building' && el.category === 'pekerja') {
        let doors = el.doors || [];
        if (!Array.isArray(doors)) doors = Object.keys(doors).sort((a, b) => a - b).map(k => doors[k]);
        el.doors = doors.map(d => {
          d = d || {};
          return Object.assign({ label: '', nama: '', jumlah: '1' }, d, { checklist: d.checklist || {}, defects: d.defects || {} });
        });
        if (el.doors.length === 0) el.doors = [createDefaultDoor()];
        el.doorCount = el.doors.length;
      } else {
        el.doors = [];
      }
      return el;
    }

    /* ===================== PHOTOS ===================== */
    function photoSrc(g) {
      if (!g) return '';
      return g.startsWith('data:') ? g : (photoCache[g] || '');
    }
    function compressImage(dataUri, maxDim = 1024, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          let out = c.toDataURL('image/jpeg', quality);
          if (out.length > 300000) out = c.toDataURL('image/jpeg', 0.45);
          resolve(out);
        };
        img.onerror = () => reject(new Error('Gambar tidak sah'));
        img.src = dataUri;
      });
    }
    async function storeNewPhoto(dataUri) {
      const compressed = await compressImage(dataUri);
      const id = 'p' + Date.now() + Math.random().toString(36).slice(2, 7);
      await db.ref('photos/' + id).set(compressed);
      photoCache[id] = compressed;
      return id;
    }
    function deletePhoto(g) {
      if (g && !g.startsWith('data:') && db) {
        db.ref('photos/' + g).remove().catch(() => {});
        delete photoCache[g];
      }
    }
    function collectPhotoIds(doors) {
      const ids = [];
      (doors || []).forEach(d => ['checklist', 'defects'].forEach(k => {
        Object.values(d[k] || {}).forEach(e => { if (e && e.gambar) ids.push(e.gambar); if (e && e.gambarTindakan) ids.push(e.gambarTindakan); });
      }));
      return ids;
    }
    function loadMissingPhotos() {
      document.querySelectorAll('img[data-photo]').forEach(img => {
        const id = img.dataset.photo;
        if (photoCache[id]) { img.src = photoCache[id]; return; }
        db.ref('photos/' + id).once('value').then(snap => {
          const v = snap.val();
          if (v) { photoCache[id] = v; img.src = v; }
        });
      });
    }

    /* ===================== LOGIN / SYNC ===================== */
    function setSyncStatus(ok) {
      const el = document.getElementById('syncStatus');
      el.textContent = ok ? '☁️ Tersambung' : '⚠️ Luar talian';
      el.textContent = ok ? '● Tersambung' : '● Luar talian'; el.style.color = ok ? '#4ADE80' : '#FBBF24';
    }
    function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pw = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');
      err.textContent = '';
      if (!email || !pw) { err.textContent = 'Sila isi emel dan kata laluan.'; return; }
      firebase.auth().signInWithEmailAndPassword(email, pw).catch(e => {
        err.textContent = 'Log masuk gagal: emel atau kata laluan salah.';
        console.error(e);
      });
    }
    function doLogout() { firebase.auth().signOut(); }

    function startCloudSync() {
      dbReady = true;
      db.ref('.info/connected').on('value', s => setSyncStatus(s.val() === true));
      Promise.all([db.ref('elements').once('value'), db.ref('layoutNames').once('value')])
        .then(([legacySnap, namesSnap]) => {
          if (!namesSnap.val()) {
            const u = { 'layoutNames/lp2': 'LP2' };
            const legacy = legacySnap.val();
            if (legacy) { u['layouts/lp2/elements'] = legacy; u['elements'] = null; }
            return db.ref().update(u);
          }
        })
        .then(() => {
          db.ref('layoutNames').on('value', snap => {
            layouts = snap.val() || {};
            const ids = Object.keys(layouts);
            if (!ids.length) return;
            if (!currentLayoutId || !layouts[currentLayoutId]) {
              currentLayoutId = ids[0];
              localStorage.setItem('currentLayoutId_v1', currentLayoutId);
            }
            renderLayoutSelect();
            if (listeningLayoutId !== currentLayoutId) attachElementsListener();
          }, err => alert('Tiada kebenaran membaca data: ' + err.message));
        })
        .catch(err => alert('Gagal sambung ke Firebase: ' + err.message));
      refreshImportButton();
    }

    function attachElementsListener() {
      if (listeningLayoutId) db.ref('layouts/' + listeningLayoutId + '/elements').off();
      listeningLayoutId = currentLayoutId;
      elements = []; lastSaved = {}; selectedId = null; firstSnapshotHandled = false;
      closeDetailModal();
      resetView();
      renderAll();
      db.ref('layouts/' + currentLayoutId + '/elements').on('value', snap => {
        const val = snap.val() || {};
        elements = Object.keys(val).map(k => normalizeElement(val[k])).sort((a, b) => idTime(a.id) - idTime(b.id));
        lastSaved = {};
        elements.forEach(e => { lastSaved[e.id] = JSON.stringify(e); });
        if (selectedId && !elements.some(e => e.id === selectedId)) selectedId = null;
        renderAll();
        if (pendingOpenId) {
          const pid = pendingOpenId; pendingOpenId = null;
          if (elements.some(e => e.id === pid)) openDetailModal(pid);
          history.replaceState(null, '', location.pathname);
        }
        if (!firstSnapshotHandled) {
          firstSnapshotHandled = true;
          if (elements.length === 0 && Object.keys(layouts).length === 1 && getLegacyLocal().length > 0) {
            if (confirm('Layout ini kosong, tetapi ada data lama pada peranti ini. Muat naik ke Firebase sekarang?')) importLegacyLocal(true);
          }
        }
      }, err => alert('Tiada kebenaran membaca data: ' + err.message));
    }

    function stopCloudSync() {
      if (db) {
        db.ref('.info/connected').off();
        db.ref('layoutNames').off();
        if (listeningLayoutId) db.ref('layouts/' + listeningLayoutId + '/elements').off();
      }
      dbReady = false;
      firstSnapshotHandled = false;
      listeningLayoutId = null;
      layouts = {};
      elements = []; lastSaved = {}; selectedId = null;
      closeDetailModal();
      renderAll();
    }

    /* ===================== LAYOUTS ===================== */
    function currentLayoutName() { return layouts[currentLayoutId] || 'LP2'; }

    function renderLayoutSelect() {
      const sel = document.getElementById('layoutSelect');
      sel.innerHTML = Object.keys(layouts)
        .sort((a, b) => (layouts[a] || '').localeCompare(layouts[b] || ''))

    }

      if (!layouts[id] || id === currentLayoutId) return;
      currentLayoutId = id;
      localStorage.setItem('currentLayoutId_v1', id);

    function addLayout() {
      const name = (prompt('Nama layout baharu (cth: LP3, Bahagian B):') || '').trim();
      if (!name) return;
      const id = 'l' + Date.now();
      currentLayoutId = id;

    function renameLayout() {
      const name = (prompt('Tukar nama layout:', currentLayoutName()) || '').trim();
      if (!name) return;
      db.ref().update({ ['layoutNames/' + currentLayoutId]: name.slice(0, 40) })
        .catch(err => alert('Gagal tukar nama: ' + err.message));
    }

    function deleteLayout() {
      const ids = Object.keys(layouts);
      if (ids.length <= 1) { alert('Sekurang-kurangnya satu layout diperlukan.'); return; }
      const name = currentLayoutName();
      if (!confirm(`Padam layout "${name}" beserta SEMUA bangunan, rekod dan gambar di dalamnya? Tindakan ini tidak boleh dibatalkan.`)) return;
      if (!confirm(`Pasti? Layout "${name}" akan dipadam kekal.`)) return;
      const doomedId = currentLayoutId;
      elements.forEach(e => collectPhotoIds(e.doors).forEach(deletePhoto));
      const nextId = ids.find(i => i !== doomedId);
      currentLayoutId = nextId;
      localStorage.setItem('currentLayoutId_v1', nextId);
      attachElementsListener();
      db.ref().update({ ['layoutNames/' + doomedId]: null, ['layouts/' + doomedId]: null })
        .catch(err => alert('Gagal padam layout: ' + err.message));
    }

    function initFirebase() {
      const loginMsg = document.getElementById('loginMessage');
      if (firebaseConfig.apiKey.startsWith('PASTE') || firebaseConfig.appId.startsWith('PASTE')) {
        loginMsg.innerHTML = '⚙️ <b>Firebase belum disambung.</b><br>Sila kemaskini <code>firebaseConfig</code>.';
        document.getElementById('loginForm').style.display = 'none';
        return;
      }
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          document.getElementById('login-overlay').style.display = 'none';
          startCloudSync();
        } else {
          stopCloudSync();
          document.getElementById('login-overlay').style.display = 'flex';
        }
      });
    }

    /* ===================== IMPORT DATA LAMA ===================== */
    function getLegacyLocal() {
      if (localStorage.getItem('firebaseImported_v1')) return [];
      const seen = new Set(), out = [];
      const keys = ['myCanvasElements_v6'];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('layoutElements_v1_')) keys.push(k);
      }
      keys.forEach(k => {
        try {
          (JSON.parse(localStorage.getItem(k)) || []).forEach(el => {
            if (el && el.id && !seen.has(el.id)) { seen.add(el.id); out.push(el); }
          });
        } catch (e) {}
      });
      return out;
    }
    function refreshImportButton() {
      document.getElementById('btnImportLocal').style.display = getLegacyLocal().length > 0 ? 'inline-block' : 'none';
    }
    async function importLegacyLocal(skipConfirm) {
      const legacy = getLegacyLocal();
      if (!legacy.length || !dbReady) return;
      if (!skipConfirm && !confirm(`Muat naik ${legacy.length} elemen dari peranti ini ke layout "${currentLayoutName()}"? Elemen dengan ID yang sama akan dilangkau.`)) return;
      loadingOverlay.style.display = 'flex';
      try {
        const existing = new Set(elements.map(e => e.id));
        const toAdd = [];
        for (const raw of legacy) {
          if (existing.has(raw.id)) continue;
          const el = normalizeElement(raw);
          for (const door of el.doors) {
            for (const listKey of ['checklist', 'defects']) {
              for (const key of Object.keys(door[listKey])) {
                const entry = door[listKey][key];
                if (entry && entry.gambar && entry.gambar.startsWith('data:')) {
                  entry.gambar = await storeNewPhoto(entry.gambar);
                }
              }
            }
          }
          toAdd.push(el);
        }
        elements = elements.concat(toAdd);
        saveToStorage();
        localStorage.setItem('firebaseImported_v1', '1');
        refreshImportButton();
        renderAll();
        alert(`Selesai. ${toAdd.length} elemen dimuat naik ke Firebase.`);
      } catch (err) {
        alert('Gagal import: ' + err.message);
      } finally {
        loadingOverlay.style.display = 'none';
      }
    }

      localStorage.setItem('myLayoutLocked_v6', JSON.stringify(isLayoutLocked));

    function snapToGrid(value) { return Math.round(value / GRID_SIZE) * GRID_SIZE; }

    function createDefaultDoor() {

    /* ===================== ADD / DELETE BUILDINGS ===================== */
    function nextGridSpawn() {
      const count = elements.length;
      const col = count % 5;
      const row = Math.floor(count / 5);
      return { x: snapToGrid(60 + col * 220), y: snapToGrid(60 + row * 160) };
    }

    function addBuilding(category, doorCount = 6) {
      const config = CATEGORY_CONFIG[category] || CATEGORY_CONFIG.pekerja;
      const id = category + '_' + Date.now();

      let spawnX, spawnY;
      if (currentView === 'map') {
        spawnX = snapToGrid((-panX + (window.innerWidth / 2) - 80) / zoomLevel);
        spawnY = snapToGrid((-panY + (window.innerHeight / 2) - 50) / zoomLevel);
      } else {
        const spot = nextGridSpawn();
        spawnX = spot.x; spawnY = spot.y;
      }

      const resolvedDoorCount = (doorCount === 4) ? 4 : 6;

      const newBuilding = {
        id: id, type: 'building', category: category, name: config.label,
        x: spawnX, y: spawnY, w: snapToGrid(config.defaultW), h: snapToGrid(config.defaultH),
        rotation: 0,
        doorCount: category === 'pekerja' ? resolvedDoorCount : undefined,
        doors: category === 'pekerja' ? Array.from({ length: resolvedDoorCount }, createDefaultDoor) : []
      };

      elements.push(newBuilding);
      saveToStorage();
      renderAll();
      if (currentView === 'map') selectElement(id);
    }

    function addRoad() {
      const id = 'road_' + Date.now();
      let spawnX, spawnY;
      if (currentView === 'map') {
        spawnX = snapToGrid((-panX + (window.innerWidth / 2) - 150) / zoomLevel);
        spawnY = snapToGrid((-panY + (window.innerHeight / 2) - 20) / zoomLevel);
      } else {

        spawnX = spot.x; spawnY = spot.y;
      }
      const newRoad = {
        id: id, type: 'road', category: 'jalan', name: 'JALAN UTAMA',
        x: spawnX, y: spawnY, w: snapToGrid(300), h: snapToGrid(40), rotation: 0
      };
      elements.push(newRoad);
      saveToStorage();
      renderAll();
      if (currentView === 'map') selectElement(id);

    function deleteElement(id) {
      if (confirm('Adakah anda pasti mahu memadamkan elemen ini?')) {
        const doomed = elements.find(e => e.id === id);
        if (doomed) collectPhotoIds([...(doomed.doors || []), doomed]).forEach(deletePhoto);
        elements = elements.filter(e => e.id !== id);

        saveToStorage();
        closeDetailModal();
        renderAll();
      }

    /* ===================== LIST VIEW ===================== */
    function renderFilterBar() {
      filterBar.innerHTML = FILTER_CHIPS.map(f =>
        `<button class="filter-chip ${activeFilter === f.key ? 'active' : ''}" onclick="setFilter('${f.key}')">${f.label}</button>`
      ).join('');
    }

    function setFilter(key) {
      activeFilter = key;
      renderFilterBar();
      renderList();
    }

    function matchesSearch(item) {
      if (!searchQuery) return true;
      const config = CATEGORY_CONFIG[item.category];
      if (config && config.label.toLowerCase().includes(searchQuery)) return true;
      if (item.name && item.name.toLowerCase().includes(searchQuery)) return true;
      if (item.doors) {
        return item.doors.some(d => d.nama && d.nama.toLowerCase().includes(searchQuery));
      }
      return false;
    }

    function countDefects(item) {
      let n = 0;
      if (item.defects) Object.values(item.defects).forEach(e => { if (isOpenDefect(e)) n++; });
      if (item.doors) {
        item.doors.forEach(d => {
          if (d.defects) Object.values(d.defects).forEach(e => { if (isOpenDefect(e)) n++; });
        });
      }
      return n;
    }

    function refreshBackgroundView() {
      updateDefectBadge();
      if (currentView === 'list') renderList();
      else { renderCanvas(); applyMapSearchHighlight(); }
    }

    function occupancySummary(item) {
      if (item.category !== 'pekerja' || !item.doors) return null;
      const filled = item.doors.filter(d => d.nama && d.nama.trim() !== '').length;
      return `${filled}/${item.doors.length} pintu berpenghuni`;
    }

    function renderList() {
      const filtered = elements.filter(item => {
        if (activeFilter === 'ganti') {
          if (countReplace(item) === 0) return false;
        } else if (activeFilter === 'defect') {
          if (countDefects(item) === 0) return false;
        } else if (activeFilter !== 'semua' && item.category !== activeFilter) {
          return false;
        }
        return matchesSearch(item);
      });

      if (filtered.length === 0) {
        listScroll.innerHTML = `<div class="empty-state">Tiada bangunan dijumpai.<br>Tekan butang "+" untuk tambah bangunan baharu.</div>`;
        return;
      }

      listScroll.innerHTML = filtered.map(item => {
        const config = CATEGORY_CONFIG[item.category] || CATEGORY_CONFIG.pekerja;
        const summary = occupancySummary(item);
        const defects = countDefects(item);
        const repl = countReplace(item);
        return `
          <div class="building-card ${defects > 0 ? 'has-defect' : (repl > 0 ? 'has-repl' : '')}" onclick="openDetailModal('${item.id}')">
            <div class="card-icon">${config.icon}</div>
            <div class="card-main">
              <div class="card-title">${escapeHTML(item.name || config.label)}</div>
              <div class="card-sub">${escapeHTML(config.label)}${item.category === 'pekerja' ? ` • ${item.doors.length} Pintu` : ''}</div>
              ${summary ? `<span class="occupancy-pill">${summary}</span>` : ''}${defects > 0 ? `<span class="defect-pill">⚠️ ${defects} kerosakan</span>` : ''}${repl > 0 ? `<span class="repl-pill">🔧 ${repl} perlu ganti</span>` : ''}
            </div>
            <div class="card-chevron">›</div>
          </div>
        `;
      }).join('');
    }

    /* ===================== MAP VIEW ===================== */
    function updateLockUI() {
      if (isLayoutLocked) {
        btnLock.innerHTML = '🔒 Layout Terkunci';
        btnLock.classList.add('locked');
      } else {
        btnLock.innerHTML = '🔓 Layout Bebas';
        btnLock.classList.remove('locked');
      }
    }
    function toggleLockLayout() {
      isLayoutLocked = !isLayoutLocked;
      saveToStorageLockedState();
      updateLockUI();
      renderCanvas();
    }

    function updateViewportTransform() {
      viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      viewport.style.backgroundSize = `${20 * zoomLevel}px ${20 * zoomLevel}px`;
      zoomValDisplay.textContent = `${Math.round(zoomLevel * 100)}%`;
    }
    function resetView() {
      if (!elements || elements.length === 0) {
        panX = 0; panY = 0; zoomLevel = 1.0;
        updateViewportTransform();
        return;
      }

      let minX = Infinity, minY = Infinity;
      let maxX = -Infinity, maxY = -Infinity;

      elements.forEach(el => {
        const x = el.x || 0;
        const y = el.y || 0;
        const w = el.w || GRID_SIZE * 2;
        const h = el.h || GRID_SIZE * 2;

        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x + w > maxX) maxX = x + w;
        if (y + h > maxY) maxY = y + h;
      });

      const padding = 60;
      const contentWidth = (maxX - minX) + padding * 2;
      const contentHeight = (maxY - minY) + padding * 2;

      const containerWidth = container.clientWidth || window.innerWidth;
      const containerHeight = container.clientHeight || window.innerHeight;

      const scaleX = containerWidth / contentWidth;
      const scaleY = containerHeight / contentHeight;
      let calculatedZoom = Math.min(scaleX, scaleY);

      calculatedZoom = Math.min(Math.max(calculatedZoom, MIN_ZOOM), 1.2);

      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;

      panX = (containerWidth / 2) - (centerX * calculatedZoom);
      panY = (containerHeight / 2) - (centerY * calculatedZoom);
      zoomLevel = calculatedZoom;

      updateViewportTransform();
    }
    function setZoom(newZoom, centerX = window.innerWidth / 2, centerY = window.innerHeight / 2) {
      const clampedZoom = Math.min(Math.max(newZoom, MIN_ZOOM), MAX_ZOOM);
      if (clampedZoom === zoomLevel) return;
      const zoomFactor = clampedZoom / zoomLevel;
      panX = centerX - (centerX - panX) * zoomFactor;
      panY = centerY - (centerY - panY) * zoomFactor;
      zoomLevel = clampedZoom;
      updateViewportTransform();
    }
    function zoomIn() { setZoom(zoomLevel + 0.15); }
    function zoomOut() { setZoom(zoomLevel - 0.15); }
    function resetZoom() { setZoom(1.0); }

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      setZoom(zoomLevel + delta, e.clientX, e.clientY);
    }, { passive: false });

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    container.addEventListener('mousedown', (e) => {
      if (e.target === container || e.target === viewport) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        selectedId = null;
        renderCanvas();
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startPanX;
      panY = e.clientY - startPanY;
      updateViewportTransform();
    });
    window.addEventListener('mouseup', () => { isPanning = false; });

    container.addEventListener('touchstart', (e) => {
      const isTargetCanvas = (e.target === container || e.target === viewport);
      if (e.touches.length === 1) {
        if (isTargetCanvas || isLayoutLocked) {
          isPanning = true;
          startPanX = e.touches[0].clientX - panX;
          startPanY = e.touches[0].clientY - panY;
          if (isTargetCanvas) {
            selectedId = null;
            renderCanvas();
          }
        }
      } else if (e.touches.length === 2) {
        isPanning = false;
        initialPinchDist = getTouchDistance(e.touches);
        initialPinchZoom = zoomLevel;
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPanning) {
        e.preventDefault();
        panX = e.touches[0].clientX - startPanX;
        panY = e.touches[0].clientY - startPanY;
        updateViewportTransform();
      } else if (e.touches.length === 2 && initialPinchDist > 0) {
        e.preventDefault();
        const dist = getTouchDistance(e.touches);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const targetZoom = initialPinchZoom * (dist / initialPinchDist);
        setZoom(targetZoom, midX, midY);
      }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = 0;
      if (e.touches.length === 0) isPanning = false;
    });

    function renderCanvas() {
      viewport.innerHTML = '';
      elements.forEach(item => {
        const div = document.createElement('div');
        let lockClass = isLayoutLocked ? 'is-locked' : '';

        if (item.type === 'building') {
          const config = CATEGORY_CONFIG[item.category] || CATEGORY_CONFIG.pekerja;
          const defectCount = countDefects(item);
          div.className = `element-box ${config.colorClass} ${item.id === selectedId ? 'active' : ''} ${defectCount > 0 ? 'has-defect' : ''} ${countReplace(item) > 0 ? 'has-repl' : ''} ${lockClass}`;
          const doorLabel = item.category === 'pekerja' ? `<div style="font-size:10px; font-weight:normal;">(${(item.doors && item.doors.length) || item.doorCount || 6} Pintu)</div>` : '';
          const defectBadge = defectCount > 0 ? `<div class="defect-badge">!</div>` : '';
          const replBadge = countReplace(item) > 0 ? `<div class="repl-badge" title="Ada barang perlu ganti / rosak">🔧</div>` : '';
          div.innerHTML = `<div>${config.icon} ${escapeHTML(item.name || config.label)}</div>${doorLabel}${defectBadge}${replBadge}`;
        } else {
          const rd = countDefects(item);
          div.className = `element-box type-road ${item.id === selectedId ? 'active' : ''} ${rd > 0 ? 'has-defect' : ''} ${lockClass}`;
          div.innerHTML = `GK Jalan Utama${rd > 0 ? '<div class="defect-badge">!</div>' : ''}`;
        }

        div.style.left = item.x + 'px';
        div.style.top = item.y + 'px';
        div.style.width = item.w + 'px';
        div.style.height = item.h + 'px';
        div.style.transform = `rotate(${item.rotation || 0}deg)`;
        div.dataset.elId = item.id;

        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        div.appendChild(resizeHandle);

        const rotateHandle = document.createElement('div');
        rotateHandle.className = 'rotate-handle';
        rotateHandle.title = "Klik & seret untuk putar (Pegang Shift untuk snap 15°)";
        div.appendChild(rotateHandle);

        makeDraggableResizableRotatable(div, resizeHandle, rotateHandle, item);

        div.onclick = (e) => { e.stopPropagation(); selectElement(item.id); };
        div.ondblclick = (e) => { e.stopPropagation(); openDetailModal(item.id); };

        viewport.appendChild(div);
      });
    }

    function selectElement(id) {
      selectedId = id;
      renderCanvas();
    }

    function applyMapSearchHighlight() {
      elements.forEach(item => {
        const el = viewport.querySelector(`[data-el-id="${item.id}"]`);
        if (!el) return;
        const match = searchQuery && matchesSearch(item);
        if (match) {
          el.style.border = '3px solid #FACC15';
          el.style.boxShadow = '0 0 15px #FACC15';
        } else {
          el.style.border = '';
          el.style.boxShadow = '';
        }
      });
    }

    function makeDraggableResizableRotatable(el, resizeHandle, rotateHandle, item) {
      let startX, startY, startLeft, startTop;

      const onDragStart = (clientX, clientY) => {
        el.classList.add('dragging');
        startX = clientX; startY = clientY;
        startLeft = item.x; startTop = item.y;
      };
      const onDragMove = (clientX, clientY) => {
        const dx = (clientX - startX) / zoomLevel;
        const dy = (clientY - startY) / zoomLevel;
        item.x = snapToGrid(startLeft + dx);
        item.y = snapToGrid(startTop + dy);
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
      };
      const onDragEnd = () => {
        el.classList.remove('dragging');
        saveToStorage();
      };

      el.addEventListener('mousedown', (e) => {
        if (e.target === resizeHandle || e.target === rotateHandle || isLayoutLocked) return;
        e.stopPropagation();
        onDragStart(e.clientX, e.clientY);
        function onMouseMove(e) { onDragMove(e.clientX, e.clientY); }
        function onMouseUp() {
          onDragEnd();
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      el.addEventListener('touchstart', (e) => {
        if (e.target === resizeHandle || e.target === rotateHandle || isLayoutLocked || e.touches.length > 1) return;
        e.stopPropagation();
        const t = e.touches[0];
        onDragStart(t.clientX, t.clientY);
        function onTouchMove(e) {
          if (e.touches.length > 1) return;
          e.preventDefault();
          onDragMove(e.touches[0].clientX, e.touches[0].clientY);
        }
        function onTouchEnd() {
          onDragEnd();
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
        }
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd);
      }, { passive: false });

      const onResizeStart = (clientX, clientY) => {
        el.classList.add('resizing');
        startX = clientX; startY = clientY;
      };
      const onResizeMove = (clientX, clientY, startW, startH) => {
        const dx = (clientX - startX) / zoomLevel;
        const dy = (clientY - startY) / zoomLevel;
        item.w = Math.max(GRID_SIZE * 2, snapToGrid(startW + dx));
        item.h = Math.max(GRID_SIZE * 2, snapToGrid(startH + dy));
        el.style.width = item.w + 'px';
        el.style.height = item.h + 'px';
      };
      const onResizeEnd = () => {
        el.classList.remove('resizing');
        saveToStorage();
      };

      resizeHandle.addEventListener('mousedown', (e) => {
        if (isLayoutLocked) return;
        e.stopPropagation();
        onResizeStart(e.clientX, e.clientY);
        const startW = item.w, startH = item.h;
        function onMouseMove(e) { onResizeMove(e.clientX, e.clientY, startW, startH); }
        function onMouseUp() {
          onResizeEnd();
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      resizeHandle.addEventListener('touchstart', (e) => {
        if (isLayoutLocked || e.touches.length > 1) return;
        e.stopPropagation();
        const t = e.touches[0];
        onResizeStart(t.clientX, t.clientY);
        const startW = item.w, startH = item.h;
        function onTouchMove(e) {
          if (e.touches.length > 1) return;
          e.preventDefault();
          onResizeMove(e.touches[0].clientX, e.touches[0].clientY, startW, startH);
        }
        function onTouchEnd() {
          onResizeEnd();
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
        }
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd);
      }, { passive: false });

      const onRotateStart = () => {
        el.classList.add('rotating');
        const rect = el.getBoundingClientRect();
        return {
          centerX: rect.left + rect.width / 2,
          centerY: rect.top + rect.height / 2
        };
      };
      const onRotateMove = (clientX, clientY, centerX, centerY, snapShift = false) => {
        const radians = Math.atan2(clientX - centerX, -(clientY - centerY));
        let degrees = Math.round(radians * (180 / Math.PI));
        if (snapShift) degrees = Math.round(degrees / 15) * 15;
        item.rotation = degrees;
        el.style.transform = `rotate(${degrees}deg)`;
      };
      const onRotateEnd = () => {
        el.classList.remove('rotating');
        saveToStorage();
      };

      rotateHandle.addEventListener('mousedown', (e) => {
        if (isLayoutLocked) return;
        e.stopPropagation();
        const { centerX, centerY } = onRotateStart();
        function onMouseMove(e) { onRotateMove(e.clientX, e.clientY, centerX, centerY, e.shiftKey); }
        function onMouseUp() {
          onRotateEnd();
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      rotateHandle.addEventListener('touchstart', (e) => {
        if (isLayoutLocked || e.touches.length > 1) return;
        e.stopPropagation();
        const { centerX, centerY } = onRotateStart();
        function onTouchMove(e) {
          if (e.touches.length > 1) return;
          e.preventDefault();
          const t = e.touches[0];
          onRotateMove(t.clientX, t.clientY, centerX, centerY);
        }
        function onTouchEnd() {
          onRotateEnd();
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
        }
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd);
      }, { passive: false });
    }

            </div>
          ` : ''}
        </div>
      `;
    }

    function renderChecklistSection(itemId, doorIndex, door, listKey, titleClass, titleText, configList) {
      const store = door[listKey] || {};
      const rows = configList.map(chk => {
        const itemData = store[chk.key] || { status: false, tarikh: '', gambar: '', catatan: '' };
        return renderChecklistItemRow(itemId, doorIndex, listKey, chk, itemData);
      }).join('');
      return `<div class="${titleClass}">${titleText}</div>${rows}`;
    }

    function doorStatus(door) {
      let rosak = false, ganti = false;
      Object.values(door.defects || {}).forEach(e => { if (isOpenDefect(e)) rosak = true; });
      Object.values(door.checklist || {}).forEach(e => {
        if (e && e.status && e.keadaan === 'rosak') rosak = true;
        else if (e && e.status && e.keadaan === 'ganti') ganti = true;
      });
      return rosak ? 'rosak' : ganti ? 'ganti' : 'ok';
    }

    function doorOverview(item) {
      const doors = item.doors || [];
      if (!doors.length) return '';
      const filled = doors.filter(d => d.nama && d.nama.trim()).length;
      const cols = doors.length === 4 ? 2 : 3;
      const tiles = doors.map((d, i) => {
        const st = doorStatus(d);
        const vacant = !(d.nama && d.nama.trim());
        const label = d.label && d.label.trim() ? d.label : 'Pintu ' + (i + 1);
        const flag = st === 'rosak' ? '⚠️ Rosak / kerosakan' : st === 'ganti' ? '🔧 Perlu ganti' : '';
        return `<div class="door-tile st-${st} ${vacant ? 'vacant' : ''}" onclick="document.getElementById('door-${item.id}-${i}').scrollIntoView({behavior:'smooth',block:'start'})">
          <div class="dt-label">${escapeHTML(label)}</div>
          <div class="dt-name">${vacant ? 'Kosong' : escapeHTML(d.nama.trim())}</div>
          ${flag ? `<div class="dt-flag">${flag}</div>` : ''}
        </div>`;
      }).join('');
      return `<div class="door-ov">
        <div class="door-ov-head"><b>Ringkasan Pintu</b><span>${filled} / ${doors.length} berpenghuni</span></div>
        <div class="door-ov-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));">${tiles}</div>
        <div class="door-ov-legend"><span><i style="background:var(--ok)"></i>Baik</span><span><i style="background:#D97706"></i>Perlu ganti</span><span><i style="background:var(--bad)"></i>Rosak / kerosakan</span><span><i style="background:#CBD5E1"></i>Kosong</span></div>
      </div>`;
    }

    function openDetailModal(id) {
      selectedId = id;
      const item = elements.find(e => e.id === id);
      if (!item) return;

      const config = CATEGORY_CONFIG[item.category] || CATEGORY_CONFIG.jalan;
      document.getElementById('detailModalTitle').textContent = `${config.icon} ${item.name || config.label}`;

      let formHTML = `
        <div class="rename-field">
          <input type="text" value="${escapeHTML(item.name || config.label)}" maxlength="60" placeholder="${escapeHTML(config.label)}" onchange="updateBuildingName('${item.id}', this.value)">
        </div>
        <div class="card-sub" style="margin:-8px 0 10px 2px;">${config.label}</div>
        <button class="btn-action btn-pdf" onclick="exportPDF('${item.id}')">📄 Eksport PDF ${item.type === 'road' ? 'Jalan Ini' : 'Bangunan Ini'}</button>
      `;

      if (item.type === 'building' && item.category === 'pekerja') formHTML += doorOverview(item);

      const flagged = replaceList(item);
      if (flagged.length) {
        formHTML += `<div class="warn-banner"><b>⚠️ ${flagged.length} barang perlu diganti / rosak</b><br>${flagged.map(f => `${escapeHTML(f.door)}: ${f.label} (${f.k === 'rosak' ? 'Rosak' : 'Perlu Diganti'})`).join('<br>')}</div>`;
      }

      if (item.type === 'building' && item.category === 'pekerja') {
        formHTML += `<hr style="border-color:#334155; margin:12px 0;"><h4 style="margin:0 0 10px 0; color:#10B981;">Maklumat ${item.doors.length} Pintu</h4>`;

        if (!item.doors || item.doors.length === 0) {
          item.doors = Array.from({ length: item.doorCount || 6 }, createDefaultDoor);
        }

        item.doors.forEach((door, index) => {
          if (!door.checklist) door.checklist = {};
          if (!door.defects) door.defects = {};
          const doorTitle = door.label && door.label.trim() ? door.label : `PINTU ${index + 1}`;

          formHTML += `
            <div class="door-card" id="door-${item.id}-${index}">
              <div class="door-card-title">${escapeHTML(doorTitle)}${countDoorReplace(door) ? ` <span class="badge st-prog">⚠️ ${countDoorReplace(door)} perlu ganti / rosak</span>` : ''}</div>
              <input type="text" class="door-name-input" value="${escapeHTML(door.label || '')}" maxlength="40" placeholder="Nama pintu/bilik (cth: Bilik A) — pilihan" onchange="updateDoorData('${item.id}', ${index}, 'label', this.value)">
              <div class="form-group">
                <label>Nama Penghuni:</label>
                <input type="text" value="${escapeHTML(door.nama || '')}" maxlength="50" placeholder="Nama pekerja..." onchange="updateDoorData('${item.id}', ${index}, 'nama', this.value)">
              </div>
              <div class="form-group">
                <label>Jumlah Penghuni:</label>
                <input type="number" min="0" max="20" value="${door.jumlah || '1'}" onchange="updateDoorData('${item.id}', ${index}, 'jumlah', this.value)">
              </div>
              ${renderChecklistSection(item.id, index, door, 'checklist', 'checklist-title', 'Rekod Kelengkapan & Penggantian:', ITEMS_CHECKLIST)}
              ${renderChecklistSection(item.id, index, door, 'defects', 'checklist-title-defect', '⚠️ Senarai Semak Kerosakan:', DEFECT_CHECKLIST)}
            </div>
          `;
        });

        formHTML += `
          <div class="door-actions-row">
            <button class="btn-door-add" onclick="addDoorToBuilding('${item.id}')">➕ Tambah Pintu</button>
            <button class="btn-door-remove" onclick="removeLastDoor('${item.id}')">➖ Buang Pintu Terakhir</button>
          </div>
        `;
      }

      if (item.category !== 'pekerja') {
        formHTML += `<div class="door-card" style="margin-top:12px;"><div class="door-card-title">Laporan Kerosakan & Tindakan</div>${renderChecklistSection(item.id, -1, item, 'defects', 'checklist-title-defect', 'Senarai Semak Kerosakan:', checklistFor(item))}</div>`;
      }

      formHTML += `<button class="btn-action btn-delete" onclick="deleteElement('${item.id}')">🗑️ Padam Elemen</button>`;
      document.getElementById('detailModalContent').innerHTML = formHTML;
      document.getElementById('detailModalBackdrop').classList.add('open');
      loadMissingPhotos();
    }

    function updateBuildingName(id, value) {
      const item = elements.find(e => e.id === id);
      if (!item) return;
      const config = CATEGORY_CONFIG[item.category] || CATEGORY_CONFIG.jalan;
      item.name = value.trim() || config.label;
      saveToStorage();
      openDetailModal(id);
      if (currentView === 'list') renderList(); else renderCanvas();
    }

    function addDoorToBuilding(id) {
      const item = elements.find(e => e.id === id);
      if (!item || !item.doors) return;
      item.doors.push(createDefaultDoor());
      item.doorCount = item.doors.length;
      saveToStorage();
      openDetailModal(id);
      if (currentView === 'list') renderList();
    }

    function removeLastDoor(id) {
      const item = elements.find(e => e.id === id);
      if (!item || !item.doors || item.doors.length <= 1) {
        alert('Sekurang-kurangnya satu pintu diperlukan.');
        return;
      }
      if (!confirm(`Padam ${item.doors[item.doors.length - 1].label || 'pintu terakhir'}? Rekod pintu ini akan hilang.`)) return;
      collectPhotoIds([item.doors[item.doors.length - 1]]).forEach(deletePhoto);
      item.doors.pop();
      item.doorCount = item.doors.length;
      saveToStorage();
      openDetailModal(id);
      refreshBackgroundView();
    }

    function closeDetailModal() {
      document.getElementById('detailModalBackdrop').classList.remove('open');
    }

    function updateDoorData(id, doorIndex, field, value) {
      const item = elements.find(e => e.id === id);
      if (item && item.doors && item.doors[doorIndex]) {
        item.doors[doorIndex][field] = value.trim();
        saveToStorage();
        if (currentView === 'list') renderList();
        if (currentView === 'map') renderCanvas();
        if (field === 'label') openDetailModal(id);
      }
    }

    function getChecklistEntry(id, doorIndex, listKey, key, createIfMissing) {
      const item = elements.find(e => e.id === id);
      const door = doorIndex === -1 ? item : (item && item.doors && item.doors[doorIndex]);
      if (!door) return null;
      if (!door[listKey]) door[listKey] = {};
      if (!door[listKey][key] && createIfMissing) {
        door[listKey][key] = { status: false, tarikh: '', gambar: '', catatan: '' };
      }
      return door[listKey][key] || null;
    }

    function updateItemStatus(id, doorIndex, listKey, key, checked) {
      const entry = getChecklistEntry(id, doorIndex, listKey, key, true);
      if (!entry) return;
      entry.status = checked;
      if (checked) entry.tarikh = todayStr();
      if (listKey === 'defects' && checked && (!entry.tindakan || entry.tindakan === 'selesai')) entry.tindakan = 'baru';
      saveToStorage();
      openDetailModal(id);
      refreshBackgroundView();
    }
    const COND = { ganti: 'Perlu Diganti', rosak: 'Rosak' };
    function updateItemCondition(id, di, listKey, key, val) {
      const e = getChecklistEntry(id, di, listKey, key, false);
      if (!e) return;
      e.keadaan = val;
      if (val) e.tarikh = todayStr();
      saveToStorage();
      openDetailModal(id);
      refreshBackgroundView();
    }
    function replaceList(item) {
      const out = [];
      (item.doors || []).forEach((d, i) => ITEMS_CHECKLIST.forEach(c => {
        const e = d.checklist && d.checklist[c.key];
        if (e && e.status && e.keadaan) out.push({ door: d.label && d.label.trim() ? d.label : 'Pintu ' + (i + 1), label: c.label, k: e.keadaan });
      }));
      return out;
    }
    function countDoorReplace(d) {
      return Object.values(d.checklist || {}).filter(e => e && e.status && e.keadaan).length;
    }
    function countReplace(item) {
      let n = 0;
      (item.doors || []).forEach(d => Object.values(d.checklist || {}).forEach(e => { if (e && e.status && e.keadaan) n++; }));
      return n;
    }
    function updateItemDate(id, doorIndex, listKey, key, dateVal) {
      const entry = getChecklistEntry(id, doorIndex, listKey, key, false);
      if (!entry) return;
      entry.tarikh = dateVal;
      saveToStorage();
    }
    function updateItemRemarks(id, doorIndex, listKey, key, val) {
      const entry = getChecklistEntry(id, doorIndex, listKey, key, false);
      if (!entry) return;
      entry.catatan = val.trim();
      saveToStorage();
    }
    function uploadItemImage(e, id, doorIndex, listKey, key, field) {
      field = field || 'gambar';
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function (evt) {
        try {
          const photoId = await storeNewPhoto(evt.target.result);
          const entry = getChecklistEntry(id, doorIndex, listKey, key, false);
          if (!entry) return;
          deletePhoto(entry[field]);
          entry[field] = photoId;
          afterDefectChange(id);
        } catch (err) {
          alert('Gagal muat naik gambar: ' + err.message);
        }
      };
      reader.readAsDataURL(file);
    }
    function removeItemImage(id, doorIndex, listKey, key, field) {
      field = field || 'gambar';
      const entry = getChecklistEntry(id, doorIndex, listKey, key, false);
      if (!entry) return;
      deletePhoto(entry[field]);
      entry[field] = '';
      afterDefectChange(id);
    }

    /* ===================== CAMERA ===================== */
    function openCameraModal(id, doorIndex, listKey, key, field) {
      activeCamTarget = { houseId: id, doorIndex: doorIndex, listKey: listKey, key: key, field: field || 'gambar' };
      const modal = document.getElementById('camera-modal');
      const video = document.getElementById('camera-video');
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          cameraStream = stream;
          video.srcObject = stream;
          modal.style.display = 'flex';
        })
        .catch(err => { alert('Gagal mengakses kamera: ' + err.message); });
    }
    function closeCameraModal() {
      document.getElementById('camera-modal').style.display = 'none';
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }
    function takePicture() {
      const video = document.getElementById('camera-video');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUri = canvas.toDataURL('image/jpeg', 0.8);
      const { houseId, doorIndex, listKey, key, field } = activeCamTarget;
      closeCameraModal();
      storeNewPhoto(dataUri).then(photoId => {
        const entry = getChecklistEntry(houseId, doorIndex, listKey, key, false);
        if (!entry) return;
        deletePhoto(entry[field]);
        entry[field] = photoId;
        afterDefectChange(houseId);
      }).catch(err => alert('Gagal simpan gambar: ' + err.message));
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && cameraStream) closeCameraModal();
    });

    /* ===================== PDF EXPORT ===================== */
    async function exportPDF(targetId) {
      loadingOverlay.style.display = 'flex';
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');

      try {
        const wasMapView = currentView === 'map';
        if (!wasMapView) {
          switchView('map');
          resetView();
          await new Promise(r => setTimeout(r, 50));
        }

        const canvasContainer = document.getElementById('canvas-container');
        const activeElem = document.querySelector('.element-box.active');
        if (activeElem) activeElem.classList.remove('active');

        const canvasMap = await html2canvas(canvasContainer, {
          scale: 2, useCORS: true, backgroundColor: '#EEF2F7'
        });

        if (activeElem && selectedId) activeElem.classList.add('active');
        if (!wasMapView) switchView('list');

        const mapImgData = canvasMap.toDataURL('image/png');

        pdf.setFontSize(16);
        pdf.setTextColor(15, 23, 42);
        pdf.text(`Pelan / Layout Visual Tapak ${currentLayoutName()}`, 14, 15);
        pdf.setFontSize(9);
        pdf.setTextColor(100);
        pdf.text(`Tarikh Cetakan: ${new Date().toLocaleDateString('ms-MY')}`, 14, 21);

        const imgWidth = 180;
        const imgHeight = (canvasMap.height * imgWidth) / canvasMap.width;
        pdf.addImage(mapImgData, 'PNG', 14, 25, imgWidth, Math.min(imgHeight, 140));

        let exportList = [];
        if (targetId === 'all') {
          exportList = elements;
        } else {
          const single = elements.find(e => e.id === targetId);
          if (single) exportList = [single];
        }

        if (exportList.length > 0) {
          pdf.addPage();
          for (let i = 0; i < exportList.length; i++) {
            if (i > 0) pdf.addPage();
            const item = exportList[i];
            const config = CATEGORY_CONFIG[item.category];
            const labelText = config ? config.label : 'Jalan Utama';

            pdf.setFontSize(14);
            pdf.setTextColor(15, 23, 42);
            pdf.text(`Laporan Rekod: ${item.name || labelText}`, 14, 18);
            pdf.setFontSize(10);
            pdf.setTextColor(100);
            pdf.text(`Jenis: ${labelText}`, 14, 25);

            let startY = 35;
            if (item.category === 'pekerja' && item.doors) {
              item.doors.forEach((door, index) => {
                if (startY > 250) { pdf.addPage(); startY = 20; }
                const doorTitle = door.label && door.label.trim() ? door.label : `Pintu ${index + 1}`;
                pdf.setFontSize(11);
                pdf.setTextColor(16, 185, 129);
                pdf.text(`${doorTitle} - Penghuni: ${door.nama || 'Tiada'} (${door.jumlah || 0} Orang)`, 14, startY);
                startY += 6;
                pdf.setFontSize(9);
                pdf.setTextColor(50);
                let hasItems = false;
                ITEMS_CHECKLIST.forEach(chk => {
                  const chkData = door.checklist ? door.checklist[chk.key] : null;
                  if (chkData && chkData.status) {
                    hasItems = true;
                    if (startY > 270) { pdf.addPage(); startY = 20; }
                    pdf.text(`• ${chk.label} - Tarikh: ${chkData.tarikh || 'N/A'}${chkData.keadaan ? ' [' + COND[chkData.keadaan].toUpperCase() + ']' : ''}`, 18, startY);
                    startY += 5;
                  }
                });
                if (!hasItems) { pdf.text(`• Tiada rekod kelengkapan.`, 18, startY); startY += 5; }

                let hasDefects = false;
                DEFECT_CHECKLIST.forEach(chk => {
                  const chkData = door.defects ? door.defects[chk.key] : null;
                  if (chkData && chkData.status) {
                    hasDefects = true;
                    if (startY > 270) { pdf.addPage(); startY = 20; }
                    pdf.setTextColor(220, 38, 38);
                    const note = chkData.catatan ? ` (${chkData.catatan})` : '';
                    pdf.text(`! ${chk.label} - Dilaporkan: ${chkData.tarikh || 'N/A'} [${DEF_STATUS[defStatus(chkData)].l}]${note}`, 18, startY);
                    pdf.setTextColor(50);
                    startY += 5;
                  }
                });
                if (hasDefects) startY += 1; else { pdf.text(`• Tiada kerosakan dilaporkan.`, 18, startY); startY += 5; }
                startY += 4;
              });
            } else {
              pdf.setFontSize(10);
              let any = false;
              checklistFor(item).forEach(chk => {
                const d = item.defects ? item.defects[chk.key] : null;
                if (d && d.status) {
                  any = true;
                  pdf.setTextColor(220, 38, 38);
                  pdf.text(`! ${chk.label} - Dilaporkan: ${d.tarikh || 'N/A'} [${DEF_STATUS[defStatus(d)].l}]${d.catatan ? ' (' + d.catatan + ')' : ''}`, 14, startY);
                  startY += 6;
                }
              });
              if (!any) { pdf.setTextColor(50); pdf.text(`Tiada kerosakan dilaporkan.`, 14, startY); }
            }
          }
        }

        pdf.save(`Laporan_LP2_Bersama_Map_${Date.now()}.pdf`);
      } catch (err) {
        alert("Gagal menjana PDF: " + err.message);
      } finally {
        loadingOverlay.style.display = 'none';
      }
    }


    /* ===================== DEFECT ACTION WORKFLOW ===================== */
    const DEF_STATUS = {
      baru:    { l: 'Baharu', c: 'st-new' },
      proses:  { l: 'Dalam Tindakan', c: 'st-prog' },
      selesai: { l: 'Selesai', c: 'st-done' }
    };
    const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

    function evidenceBlock(id, di, key, e) {
      const a = `'${id}', ${di}, 'defects', '${key}', 'gambarTindakan'`;
      return `<div class="evidence">
        <label>📎 Gambar Bukti Tindakan / Pembaikan:</label>
        <div class="image-action-buttons">
          <button class="btn-camera-action" type="button" onclick="openCameraModal(${a})">📸 Kamera</button>
          <label class="btn-gallery-action">🖼️ Galeri / Fail
            <input type="file" accept="image/*" style="display:none;" onchange="uploadItemImage(event, ${a})">
          </label>
        </div>
        ${e.gambarTindakan ? `<div class="img-preview-container">
          <img ${e.gambarTindakan.startsWith('data:') ? '' : `data-photo="${e.gambarTindakan}"`} src="${photoSrc(e.gambarTindakan)}" class="img-preview">
          <button class="btn-remove-img" onclick="removeItemImage(${a})" title="Padam Gambar">✖</button>
        </div>` : ''}
      </div>`;
    }
    function defStatus(e) { return DEF_STATUS[e && e.tindakan] ? e.tindakan : 'baru'; }
    function isOpenDefect(e) { return !!(e && e.status && defStatus(e) !== 'selesai'); }

    const ROAD_DEFECT_CHECKLIST = [
      { key: 'lubangJalan', label: 'Lubang / Jalan Berlubang' },
      { key: 'lampuJalan', label: 'Lampu Jalan Rosak' },
      { key: 'paritTersumbat', label: 'Parit Tersumbat' },
      { key: 'jalanRetak', label: 'Permukaan Jalan Retak / Runtuh' },
      { key: 'papanTanda', label: 'Papan Tanda Rosak' },
      { key: 'bahuJalan', label: 'Bahu Jalan Terhakis' }
    ];
    function checklistFor(item) { return item.category === 'jalan' ? ROAD_DEFECT_CHECKLIST : DEFECT_CHECKLIST; }

    function allDefects() {
      const out = [];
      elements.forEach(item => {
        if (item.category === 'pekerja') return;
        checklistFor(item).forEach(chk => {
          const e = item.defects && item.defects[chk.key];
          if (e && e.status) out.push({ item, door: null, di: -1, chk, e });
        });
      });
      elements.forEach(item => (item.doors || []).forEach((door, di) => {
        DEFECT_CHECKLIST.forEach(chk => {
          const e = door.defects && door.defects[chk.key];
          if (e && e.status) out.push({ item, door, di, chk, e });
        });
      }));
      return out;
    }
    function updateDefectBadge() {
      const n = allDefects().filter(d => isOpenDefect(d.e)).length;
      const b = document.getElementById('defectCount');
      b.textContent = n; b.style.display = n ? 'inline-block' : 'none';
    }
    function afterDefectChange(id) {
      saveToStorage();
      if (document.getElementById('detailModalBackdrop').classList.contains('open')) openDetailModal(id);
      refreshBackgroundView();
    }
    function setDefectAction(id, di, key, status) {
      const e = getChecklistEntry(id, di, 'defects', key, false);
      if (!e) return;
      if (status === 'selesai' && !e.gambarTindakan && !confirm('Tiada gambar bukti tindakan. Tandakan selesai tanpa gambar?')) { afterDefectChange(id); return; }
      e.tindakan = status;
      if (status === 'proses' && !e.tarikhTindakan) e.tarikhTindakan = todayStr();
      if (status === 'selesai') e.tarikhSelesai = todayStr(); else delete e.tarikhSelesai;
      afterDefectChange(id);
    }
    function setDefectField(id, di, key, field, val) {
      const e = getChecklistEntry(id, di, 'defects', key, false);
      if (!e) return;
      e[field] = val.trim();
      saveToStorage();
    }
    /* ===================== HEADER MENU ===================== */
    function toggleMenu(ev) { ev.stopPropagation(); document.getElementById('mainMenu').classList.toggle('open'); }
    document.addEventListener('click', () => document.getElementById('mainMenu').classList.remove('open'));

    /* ===================== INIT ===================== */
    updateLockUI();
    switchView(currentView);
    initFirebase();
  </script>
</body>
</html>
