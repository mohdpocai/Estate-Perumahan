<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ringkasan Kelengkapan - LP2</title>
  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="shared.css?v=1">
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>🏘️ Pengurusan LP2</h2>
      <p id="loginMessage">Sila log masuk untuk mengakses rekod.</p>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Emel" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Kata laluan" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
        <button onclick="doLogin()">Log Masuk</button>
      </div>
      <div id="loginError"></div>
    </div>
  </div>

  <div id="app-container">
    <header id="app-header">
      <div class="brand"><span class="logo">LP2</span><span class="brand-text">Pengurusan Rumah Pekerja</span></div>
      <select id="layoutSelect" onchange="changeLayout(this.value)" title="Pilih layout"></select>
      <nav class="view-tabs">
        <a class="view-tab" href="index.html#list">Senarai</a>
        <a class="view-tab" href="index.html#map">Pelan</a>
        <a class="view-tab" href="kerosakan.html">Kerosakan <span class="tab-count" id="defectCount">0</span></a>
        <a class="view-tab active" href="ringkasan.html">Ringkasan</a>
      </nav>
      <input type="text" id="headerSearch" placeholder="Cari pekerja, bangunan atau kerosakan..." oninput="onSearchInput()">
      <span id="syncStatus">...</span>
      <button class="icon-btn" onclick="doLogout()" title="Log Keluar">⎋</button>
    </header>

    <div id="summaryView" class="page-view"><div id="summaryScroll"></div></div>
  </div>

  <script src="shared.js?v=1"></script>
  <script>
const COND = { ganti: 'Perlu Diganti', rosak: 'Rosak' };

    function allEquip() {
      const out = [];
      elements.forEach(item => (item.doors || []).forEach((door, di) => ITEMS_CHECKLIST.forEach(chk => {
        const e = door.checklist && door.checklist[chk.key];
        if (e && e.status) out.push({ item, door, di, chk, e });
      })));
      return out;
    }
    function renderSummary() {
      const q = searchQuery;
      const all = allEquip().filter(r => !q || [r.item.name, r.door.nama, r.door.label, r.chk.label].some(t => t && String(t).toLowerCase().includes(q)));
      const cond = r => r.e.keadaan || 'baik';
      const n = (list, k) => list.filter(r => cond(r) === k).length;
      const houses = elements.filter(e => e.category === 'pekerja');
      const doors = houses.reduce((a, h) => a + (h.doors || []).length, 0);
      const occ = houses.reduce((a, h) => a + (h.doors || []).filter(d => d.nama && d.nama.trim()).length, 0);
      const card = (v, l, c) => `<div class="sum-card plain"><b style="${c ? 'color:' + c : ''}">${v}</b><span>${l}</span></div>`;
      let html = `<div class="sum-row four">${card(all.length, 'Jumlah barang direkod')}${card(n(all, 'baik'), 'Baik', 'var(--ok)')}${card(n(all, 'ganti'), 'Perlu diganti', 'var(--warn)')}${card(n(all, 'rosak'), 'Rosak', 'var(--bad)')}</div>
        <div class="def-meta" style="margin-top:-4px;">${occ} daripada ${doors} pintu berpenghuni • ${houses.length} rumah pekerja</div>`;
      if (!all.length) html += `<div class="empty-state">Tiada rekod kelengkapan${q ? ' yang sepadan' : ''}.</div>`;
      html += ITEMS_CHECKLIST.map(chk => {
        const rows = all.filter(r => r.chk.key === chk.key);
        if (!rows.length) return '';
        const b = n(rows, 'baik'), g = n(rows, 'ganti'), r2 = n(rows, 'rosak'), t = rows.length;
        const order = { rosak: 0, ganti: 1, baik: 2 };
        rows.sort((x, y) => order[cond(x)] - order[cond(y)]);
        const pct = v => (v / t * 100).toFixed(1) + '%';
        return `<details class="sum-item" ${g + r2 > 0 ? 'open' : ''}>
          <summary>
            <div class="sum-head"><span>${chk.label}</span><span>${t} unit</span></div>
            <div class="bar"><i style="width:${pct(b)};background:var(--ok)"></i><i style="width:${pct(g)};background:#D97706"></i><i style="width:${pct(r2)};background:var(--bad)"></i></div>
            <div class="sum-counts">${b} baik • ${g} perlu diganti • ${r2} rosak</div>
          </summary>
          ${rows.map(r => {
            const c = cond(r);
            return `<div class="loc-row" onclick="location.href='index.html?open=${encodeURIComponent(r.item.id)}'">
              <div>${escapeHTML(r.item.name || 'Rumah')} • ${escapeHTML(r.door.label || 'Pintu ' + (r.di + 1))}<br><small>${r.door.nama ? escapeHTML(r.door.nama) + ' • ' : ''}Tarikh: ${r.e.tarikh || '-'}</small></div>
              <span class="badge ${c === 'rosak' ? 'st-new' : c === 'ganti' ? 'st-prog' : 'st-done'}">${c === 'baik' ? 'Baik' : COND[c]}</span>
            </div>`;
          }).join('')}
        </details>`;
      }).join('');
      document.getElementById('summaryScroll').innerHTML = html;
    }

function renderPage() {
  updateDefectBadge();
  renderSummary();
}

/* ===================== INIT ===================== */
initFirebase();
  </script>
</body>
</html>
