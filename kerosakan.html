<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Senarai Kerosakan - LP2</title>
  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="shared.css?v=1">
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>🏘️ Pengurusan LP2</h2>
      <p id="loginMessage">Sila log masuk untuk mengakses rekod.</p>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Emel" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Kata laluan" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
        <button onclick="doLogin()">Log Masuk</button>
      </div>
      <div id="loginError"></div>
    </div>
  </div>

  <div id="camera-modal">
    <h3 style="color:#38BDF8; margin-bottom:10px;">Tangkap Gambar Bukti</h3>
    <video id="camera-video" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="btn-capture" onclick="takePicture()">📸 Ambil Gambar</button>
      <button class="btn-cancel-cam" onclick="closeCameraModal()">Batal</button>
    </div>
  </div>

  <div id="app-container">
    <header id="app-header">
      <div class="brand"><span class="logo">LP2</span><span class="brand-text">Pengurusan Rumah Pekerja</span></div>
      <select id="layoutSelect" onchange="changeLayout(this.value)" title="Pilih layout"></select>
      <nav class="view-tabs">
        <a class="view-tab" href="index.html#list">Senarai</a>
        <a class="view-tab" href="index.html#map">Pelan</a>
        <a class="view-tab active" href="kerosakan.html">Kerosakan <span class="tab-count" id="defectCount">0</span></a>
        <a class="view-tab" href="ringkasan.html">Ringkasan</a>
      </nav>
      <input type="text" id="headerSearch" placeholder="Cari pekerja, bangunan atau kerosakan..." oninput="onSearchInput()">
      <span id="syncStatus">...</span>
      <button class="icon-btn" onclick="doLogout()" title="Log Keluar">⎋</button>
    </header>

    <div id="defectView" class="page-view"><div id="defectScroll"></div></div>
  </div>

  <script src="shared.js?v=1"></script>
  <script>
    function evidenceBlock(id, di, key, e) {
      const a = `'${id}', ${di}, 'defects', '${key}', 'gambarTindakan'`;
      return `<div class="evidence">
        <label>📎 Gambar Bukti Tindakan / Pembaikan:</label>
        <div class="image-action-buttons">
          <button class="btn-camera-action" type="button" onclick="openCameraModal(${a})">📸 Kamera</button>
          <label class="btn-gallery-action">🖼️ Galeri / Fail
            <input type="file" accept="image/*" style="display:none;" onchange="uploadItemImage(event, ${a})">
          </label>
        </div>
        ${e.gambarTindakan ? `<div class="img-preview-container">
          <img ${e.gambarTindakan.startsWith('data:') ? '' : `data-photo="${e.gambarTindakan}"`} src="${photoSrc(e.gambarTindakan)}" class="img-preview">
          <button class="btn-remove-img" onclick="removeItemImage(${a})" title="Padam Gambar">✖</button>
        </div>` : ''}
      </div>`;
    }
    function setDefectAction(id, di, key, status) {
      const e = getChecklistEntry(id, di, 'defects', key, false);
      if (!e) return;
      if (status === 'selesai' && !e.gambarTindakan && !confirm('Tiada gambar bukti tindakan. Tandakan selesai tanpa gambar?')) { afterDefectChange(id); return; }
      e.tindakan = status;
      if (status === 'proses' && !e.tarikhTindakan) e.tarikhTindakan = todayStr();
      if (status === 'selesai') e.tarikhSelesai = todayStr(); else delete e.tarikhSelesai;
      afterDefectChange(id);
    }
    function setDefectField(id, di, key, field, val) {
      const e = getChecklistEntry(id, di, 'defects', key, false);
      if (!e) return;
      e[field] = val.trim();
      saveToStorage();
    }
    function setDefFilter(f) { defFilter = f; renderDefects(); }
    function daysOpen(e) {
      if (!e.tarikh) return '';
      const end = e.tarikhSelesai ? new Date(e.tarikhSelesai) : new Date();
      const d = Math.max(0, Math.floor((end - new Date(e.tarikh)) / 864e5));
      return e.tarikhSelesai ? `Selesai dalam ${d} hari` : `${d} hari dibuka`;
    }

    function renderDefects() {
      const all = allDefects();
      const cnt = k => all.filter(d => defStatus(d.e) === k).length;
      const q = searchQuery;
      const list = all.filter(d => {
        const st = defStatus(d.e);
        if (defFilter === 'aktif' ? st === 'selesai' : (defFilter !== 'semua' && st !== defFilter)) return false;
        if (!q) return true;
        return [d.item.name, d.door && d.door.nama, d.door && d.door.label, d.chk.label, d.e.catatan, d.e.pihak].some(t => t && String(t).toLowerCase().includes(q));
      }).sort((a, b) => (a.e.tarikh || '').localeCompare(b.e.tarikh || ''));

      const sc = (k, label, n) => `<div class="sum-card ${defFilter === k ? 'on' : ''}" onclick="setDefFilter('${k}')"><b>${n}</b><span>${label}</span></div>`;
      let html = `<div class="sum-row">${sc('baru', 'Baharu — perlu tindakan', cnt('baru'))}${sc('proses', 'Dalam tindakan', cnt('proses'))}${sc('selesai', 'Selesai', cnt('selesai'))}</div>
        <div class="filter-bar" style="padding:0 0 12px;background:none;border:0;">
          <button class="filter-chip ${defFilter === 'aktif' ? 'active' : ''}" onclick="setDefFilter('aktif')">Belum selesai</button>
          <button class="filter-chip ${defFilter === 'semua' ? 'active' : ''}" onclick="setDefFilter('semua')">Semua rekod</button>
        </div>`;
      if (!list.length) html += `<div class="empty-state">Tiada kerosakan dalam paparan ini. 🎉</div>`;
      html += list.map(d => {
        const st = defStatus(d.e), S = DEF_STATUS[st];
        const where = d.door ? `${escapeHTML(d.item.name || 'Bangunan')} • ${escapeHTML(d.door.label || 'Pintu ' + (d.di + 1))}${d.door.nama ? ' • ' + escapeHTML(d.door.nama) : ''}` : `${escapeHTML(d.item.name || (CATEGORY_CONFIG[d.item.category] || {}).label || 'Elemen')} • ${escapeHTML((CATEGORY_CONFIG[d.item.category] || {}).label || '')}`;
        const k = `'${d.item.id}', ${d.di}, '${d.chk.key}'`;
        const btns = st === 'baru' ? `<button class="btn pri" onclick="setDefectAction(${k}, 'proses')">▶ Mula Tindakan</button><button class="btn ok" onclick="setDefectAction(${k}, 'selesai')">✔ Selesai</button>`
          : st === 'proses' ? `<button class="btn ok" onclick="setDefectAction(${k}, 'selesai')">✔ Tandakan Selesai</button>`
          : `<button class="btn" onclick="setDefectAction(${k}, 'baru')">↺ Buka Semula</button>`;
        return `<div class="def-card ${S.c}">
          <div class="def-top">
            <div style="display:flex;gap:12px;">
              ${d.e.gambar ? `<img class="def-thumb" ${d.e.gambar.startsWith('data:') ? '' : `data-photo="${d.e.gambar}"`} src="${photoSrc(d.e.gambar)}">` : ''}
              <div><div class="def-title">${d.chk.label}</div><div class="def-loc">${where}</div></div>
            </div>
            <span class="badge ${S.c}">${S.l}</span>
          </div>
          <div class="def-meta">Dilaporkan: ${d.e.tarikh || '-'} • ${daysOpen(d.e)}${d.e.catatan ? '<br>' + escapeHTML(d.e.catatan) : ''}</div>
          <div class="def-fields">
            <input type="text" value="${escapeHTML(d.e.pihak || '')}" placeholder="Pihak bertindak / kontraktor" maxlength="60" onchange="setDefectField(${k}, 'pihak', this.value)">
            <input type="text" value="${escapeHTML(d.e.catatanTindakan || '')}" placeholder="Nota tindakan" maxlength="150" onchange="setDefectField(${k}, 'catatanTindakan', this.value)">
          </div>
          ${evidenceBlock(d.item.id, d.di, d.chk.key, d.e)}
          <div class="def-actions">${btns}<a class="btn" style="text-decoration:none;" href="index.html?open=${encodeURIComponent(d.item.id)}">Butiran bangunan</a></div>
        </div>`;
      }).join('');
      document.getElementById('defectScroll').innerHTML = html;
      loadMissingPhotos();
    }

function renderPage() {
  updateDefectBadge();
  renderDefects();
}

/* ===================== INIT ===================== */
initFirebase();
  </script>
</body>
</html>
